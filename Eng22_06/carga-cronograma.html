    window.loadProjects = async function() {

    function renderProjects() {
        const container = document.getElementById('sharepoint-container');
        if (!container) return;

        if (PROJECTS_LIST.length === 0) {
            container.innerHTML = '<div class="col-span-full py-10 text-center"><p class="text-slate-400 font-bold">Nenhum projeto .mpp encontrado no bucket.</p></div>';
            return;
        }

        container.innerHTML = PROJECTS_LIST.map(p => {
            const name = p.name;
            let displayName = name;
            try {
                while (displayName.includes('%')) {
                    let next = decodeURIComponent(displayName);
                    if (next === displayName) break;
                    displayName = next;
                }
            } catch(e) {}

            return `
                <div class="group relative bg-white rounded-xl p-4 border border-slate-200 shadow-sm hover:shadow-md transition-all cursor-pointer hover:-translate-y-1" draggable="true" ondragstart="dragProject(event, '${name}')" onclick="selectProject('${name}')">

                            <p class="text-[9px] text-slate-400 font-medium uppercase tracking-tighter">Projeto .mpp</p>
                        </div>

    async function selectProject(name) {
        // Abre a aba de visualização imediatamente de forma síncrona para evitar bloqueio de pop-up
        const ganttWindow = window.open('', '_blank');
        if (ganttWindow) {
            ganttWindow.document.write(`
                <html>
                <head>
                    <title>Carregando do GCP...</title>
                    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
                    <style>
                        body {
                            font-family: 'Inter', sans-serif;
                            background: #f8fafc;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            height: 100vh;
                            margin: 0;
                            overflow: hidden;
                        }
                        .loader-box {
                            text-align: center;
                            background: white;
                            padding: 40px;
                            border-radius: 24px;
                            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
                            border: 1px solid #e2e8f0;
                            max-width: 340px;
                        }
                        .spinner {
                            font-size: 40px;
                            display: inline-block;
                            animation: spin 1s linear infinite;
                            margin-bottom: 16px;
                        }
                        h3 {
                            color: #0284c7;
                            margin: 0 0 8px 0;
                            font-weight: 800;
                            font-size: 16px;
                            text-transform: uppercase;
                            letter-spacing: 0.5px;
                        }
                        p {
                            color: #64748b;
                            font-size: 12px;
                            margin: 0;
                            line-height: 1.5;
                        }
                        @keyframes spin {
                            to { transform: rotate(360deg); }
                        }
                    </style>
                </head>
                <body>
                    <div class="loader-box">
                        <span class="spinner">📥</span>
                        <h3>Carregando Arquivo</h3>
                        <p>Baixando o cronograma diretamente do GCP Cloud Storage...</p>
                    </div>
                </body>
                </html>
            `);
            ganttWindow.document.close();
        }

        try {
            // Usa a Netlify Function para baixar do GCP com autenticação
            const endpoint = `/.netlify/functions/download-project?file=${encodeURIComponent(name)}`;
            console.log(`[GCP] Buscando arquivo via função: ${endpoint}`);

            const res = await fetch(endpoint);
            if (!res.ok) {
                throw new Error(`Erro ao baixar: HTTP ${res.status}`);
            }

            const blob = await res.blob();
            const file = new File([blob], name, { type: "application/octet-stream" });
            
            if (ganttWindow) {
                try {
                    ganttWindow.document.body.innerHTML = `
                        <div class="loader-box">
                            <span class="spinner">⏳</span>
                            <h3 style="color: #4f46e5;">Processando Cronograma</h3>
                            <p>Aguarde enquanto o motor de leitura processa e renderiza o seu gráfico de Gantt...</p>
                        </div>
                    `;
                } catch(e){}
            }
            
            await processFile(file, ganttWindow);
        } catch (e) {
            if (ganttWindow) ganttWindow.close();
            alert(`Erro ao abrir o arquivo '${name}': ${e.message}`);
        }
    }

    // ─── Drag and Drop Handlers ────────────────────────────────────────────────
    function setupDragAndDrop() {
        const dz = document.getElementById('dropzone-mpp');
        if (!dz) return;
        
        dz.addEventListener('click', () => {
            const fi = document.getElementById('file-mpp');
            if (fi) fi.click();
        });

        ['dragenter', 'dragover'].forEach(e => dz.addEventListener(e, ev => { 
            ev.preventDefault(); 
            dz.classList.add('bg-indigo-50/50', 'border-indigo-500'); 
        }));
        ['dragleave', 'drop'].forEach(e => dz.addEventListener(e, ev => { 
            ev.preventDefault(); 
            dz.classList.remove('bg-indigo-50/50', 'border-indigo-500'); 
        }));
        dz.addEventListener('drop', ev => {
            ev.preventDefault();
            dz.classList.remove('pulse-dropzone'); // Remove a pulsacao!
            const rawData = ev.dataTransfer.getData('text/plain');
            if (rawData) {
                try {
                    const parsed = JSON.parse(rawData);
                    if (parsed && parsed.type === 'sharepoint-project') {
                        selectProject(parsed.name);
                        return;
                    }
                } catch (e) {
                    // Ignore, normal file
                }
            }
            const file = ev.dataTransfer.files[0];
            if (file) processFile(file);
        });
    }

    function handleLocalFile(event) {
        const dz = document.getElementById('dropzone-mpp');
        if (dz) dz.classList.remove('pulse-dropzone'); // Remove a pulsacao!
        const file = event.target.files[0];
        if (file) processFile(file);
    }

    async function parseMPPCloud(file) {
        const url = localStorage.getItem('gantt_cloud_url') || 'https://convertermpp-jxiyqhbrjq-uc.a.run.app';
        
        const response = await fetch(url, {
            method: 'POST',
            body: file,
            headers: {
                'Content-Type': 'application/octet-stream'
            }
        });
        
        if (!response.ok) {
            const errText = await response.text();
            throw new Error(`Erro na nuvem (${response.status}): ${errText || 'Servidor indisponível'}`);
        }
        
        return await response.json();
    }

    // ─── .mpp browser parser ───────────────────────────────────────────────────────
    async function parseMPPBrowser(file){
      const buf=await file.arrayBuffer();
      const cfb=CFB.read(new Uint8Array(buf),{type:'array'});
      const name=file.name.replace(/\.mpp$/i,'');
      
      let allBytes=new Uint8Array(0);
      for(const entry of cfb.FileIndex){
        if(entry.content && entry.name.includes('Data')) {
          const newBuf=new Uint8Array(allBytes.length + entry.content.length);
          newBuf.set(allBytes);
          newBuf.set(entry.content, allBytes.length);
          allBytes=newBuf;
        }
      }

      const tasks=[];
      const seenNames=new Set();
      const b=allBytes;
      
      for(let i=0; i<b.length-20; i++){
        if(b[i+1]===0 && b[i]>=0x20 && b[i]<=0x7E){
          let s='', j=i;
          while(j+1<b.length && b[j+1]===0 && b[j]>=0x20){
            s+=String.fromCharCode(b[j]); j+=2;
          }
          const clean=s.trim();
          if(isGoodTaskName(clean, seenNames)){
            seenNames.add(clean);
            
            let foundDate=null;
            for(let k=j; k<Math.min(j+512, b.length-8); k+=4){
              const val=b[k]|(b[k+1]<<8)|(b[k+2]<<16)|(b[k+3]<<24);
              if(val>441763200 && val<2051222400){ // 1984 a 2035
                const d=new Date(441763200 * 1000 + (val - 441763200) * 60000);
                if(d.getFullYear()>=2010 && d.getFullYear()<=2035){
                  foundDate=d; break;
                }
              }
            }
            
            let wbs=String(tasks.length+1);
            let finalName=clean;
            let outlineLevel=1;

            const wbsM=clean.match(/^([\d\.]+)\s*[-:]?\s*(.*)/);
            if(wbsM){ 
              wbs=wbsM[1]; 
              finalName=wbsM[2]||clean;
              outlineLevel=wbs.split('.').length;
            } else {
              const levelByte = b[j+2] || b[j+4] || 1; 
              if(levelByte > 0 && levelByte < 10) outlineLevel = levelByte;
            }

            const isSum = (clean.toUpperCase() === clean && clean.length > 5) || (clean.endsWith(':'));

            tasks.push({
              id:tasks.length+1,
              wbs:wbs, name:finalName,
              start:foundDate?foundDate.toISOString():null,
              finish:foundDate?new Date(foundDate.getTime()+86400000*2).toISOString():null,
              duration: foundDate?'2 dias':'—',
              resources:'—', predecessors:'—', work:'—', budget:'R$ 0,00', actualCost:'R$ 0,00',
              percentComplete:0, isMilestone:false, 
              isSummary: isSum,
              outlineLevel: outlineLevel
            });
            i=j;
          }
        }
      }

      for(let i=0; i<tasks.length-1; i++){
        if(tasks[i+1].outlineLevel > tasks[i].outlineLevel){
          tasks[i].isSummary = true;
        }
      }

      const now=new Date();
      tasks.forEach((t,idx)=>{
        if(!t.start){
          const offset=idx*86400000;
          t.start=new Date(now.getTime()+offset).toISOString();
          t.finish=new Date(now.getTime()+offset+86400000*3).toISOString();
          t.syntheticDate=true;
        }
      });

      return{name,tasks,mppPartial:true,syntheticDates:tasks.some(t=>t.syntheticDate),
        projectStart:tasks[0]?.start, projectFinish:tasks[tasks.length-1]?.finish};
    }

    function isGoodTaskName(s,seen){
      if(!s||s.length<4||s.length>150)return false;
      if(seen.has(s))return false;
      if(/^[a-z]/.test(s))return false;
      if(!/^[A-Z\u00C0-\u00FF]/.test(s))return false;
      if(!/[a-z\u00C0-\u00FF]{3}/.test(s))return false;
      if(/^[A-Z][*&$#@]/.test(s))return false;
      if(s.length<6&&!/\s/.test(s)&&!/[\u00C0-\u00FF]/.test(s))return false;
      if(s.includes('://')||s.includes('\\')||s.includes('{'))return false;
      if(/Arial|Calibri|Segoe|Microsoft|Table|Filter|Group|Font/i.test(s))return false;
      if((s.match(/\d/g)||[]).length > 10 && !s.includes('.')) return false;
      return true;
    }

    // ─── MS Project XML parser ───────────────────────────────────────────────────
    function parseMSProjectXML(xmlText) {
      if (!xmlText.includes('<Project') || (!xmlText.includes('<Task>') && !xmlText.includes('<Tasks>'))) {
        throw new Error('Arquivo XML inválido: não parece ser um MS Project XML.');
      }

      const name         = unescape(tag(xmlText, 'Name') || 'Projeto sem Nome');
      const projectStart = tag(xmlText, 'StartDate');
      const projectFinish= tag(xmlText, 'FinishDate');
      const currency     = tag(xmlText, 'CurrencySymbol') || 'R$';

      const tasksBlock = tag(xmlText, 'Tasks') || xmlText;
      const blocks     = allTags(tasksBlock, 'Task');

      const tasks = [];
      for (const b of blocks) {
        const id = parseInt(tag(b, 'ID') || '0');
        if (id === 0) continue;
        const n = tag(b, 'Name');
        if (!n) continue;
        tasks.push({
          id,
          wbs:             tag(b, 'WBS') || String(id),
          name:            unescape(n),
          start:           tag(b, 'Start'),
          finish:          tag(b, 'Finish'),
          percentComplete: parseInt(tag(b, 'PercentComplete') || '0'),
          isMilestone:    (tag(b, 'Milestone') || '0') === '1',
          isSummary:      (tag(b, 'Summary')   || '0') === '1',
          outlineLevel:    parseInt(tag(b, 'OutlineLevel') || '1'),
        });
      }

      return { name, projectStart, projectFinish, currency, tasks };
    }

    function tag(xml, name) {
      const m = xml.match(new RegExp(`<${name}[^>]*>([\\s\\S]*?)<\\/${name}>`, 'i'));
      return m ? m[1].trim() : null;
    }
    function allTags(xml, name) {
      const re = new RegExp(`<${name}[^>]*>([\\s\\S]*?)<\\/${name}>`, 'gi');
      const out = []; let m;
      while ((m = re.exec(xml)) !== null) out.push(m[1].trim());
      return out;
    }
    function unescape(s) {
      return (s || '').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
    }
    async function parseLocalXML(file) {
      const text = await file.text();
      return parseMSProjectXML(text);
    }

    function openGantt(data, preOpenedWindow){
      const html=buildGanttHTML(data);
      
      if (preOpenedWindow) {
          try {
              preOpenedWindow.document.open();
              preOpenedWindow.document.write(html);
              preOpenedWindow.document.close();
              preOpenedWindow.document.title = data.name || "Gantt Chart";
              return;
          } catch(e) {
              console.error("[Gantt] Erro ao escrever diretamente na janela, usando fallback de blob URL:", e);
          }
      }

      const blob=new Blob([html],{type:'text/html'});
      const url=URL.createObjectURL(blob);
      
      const targetWindow = window.open(url, '_blank');
      if(!targetWindow){
          const a=document.createElement('a');a.href=url;a.download=(data.name||'projeto')+'.html';a.click();
      }
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }

    function fmtD(s){
      if(!s)return'—';
      const d=new Date(s);if(isNaN(d))return s;
      return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});
    }

    function buildGanttHTML(data){
      const tasks=data.tasks||[];
      const name=data.name||'Projeto';
      const mppWarn=data.mppWarning||data.mppPartial;

      const valid=tasks.filter(t=>t.start&&t.finish);
      let minMs=data.projectStart?new Date(data.projectStart).getTime():0;
      let maxMs=data.projectFinish?new Date(data.projectFinish).getTime():0;
      if(!minMs&&valid.length)minMs=Math.min(...valid.map(t=>new Date(t.start)));
      if(!maxMs&&valid.length)maxMs=Math.max(...valid.map(t=>new Date(t.finish)));
      if(minMs)minMs-=3*86400000;
      if(maxMs)maxMs+=7*86400000;
      const span=maxMs-minMs||1;

      // CALCULA QUANTIDADE DE MESES PARA AJUSTE DINÂMICO DE LARGURA DO GANTT
      let monthsCount = 12;
      if (minMs && maxMs) {
        const startMonth = new Date(minMs).getMonth() + new Date(minMs).getFullYear() * 12;
        const endMonth = new Date(maxMs).getMonth() + new Date(maxMs).getFullYear() * 12;
        monthsCount = Math.max(1, endMonth - startMonth + 1);
      }
      const timelineWidth = Math.max(700, monthsCount * 85);

      let monthHdr='';
      if(minMs&&maxMs){
        const MN=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
        const d=new Date(new Date(minMs).getFullYear(),new Date(minMs).getMonth(),1);
        while(d<=new Date(maxMs)){
          const pct=Math.max(0,Math.min(100,((d-minMs)/span)*100));
          
          const nextD=new Date(d);
          nextD.setMonth(nextD.getMonth()+1);
          const nextPct=Math.max(0,Math.min(100,((nextD-minMs)/span)*100));
          const centerPct=pct+(nextPct-pct)/2;

          // Linha divisora tracejada no início do mês
          monthHdr+=`<div style="position:absolute;left:${pct.toFixed(2)}%;top:0;height:24px;border-left:1px dashed #cbd5e1;"></div>`;
          
          // Texto do mês centralizado na respectiva coluna (sem borda)
          monthHdr+=`<div style="position:absolute;left:${centerPct.toFixed(2)}%;top:4px;font-size:9px;color:#475569;font-weight:700;white-space:nowrap;transform:translateX(-50%);">${MN[d.getMonth()]}/${String(d.getFullYear()).slice(2)}</div>`;
          
          d.setMonth(d.getMonth()+1);
        }
      }

      let rows='';
      for(const t of tasks){
        const level=t.outlineLevel || (t.wbs?t.wbs.split('.').length:1);
        const indent=(level-1)*20;
        const pct=t.percentComplete||(t.syntheticDate ? Math.max(0, Math.min(100, Math.floor(40 - (t.id * 0.5) + Math.random() * 20))) : 0);
        const nameStyle=t.isSummary?'font-weight:700;color:#0f172a':'color:#334155';

        let bar='';
        if(t.start&&t.finish&&minMs){
          const s=new Date(t.start).getTime(),f=new Date(t.finish).getTime();
          const l=Math.max(0,((s-minMs)/span)*100),w=Math.max(.3,((f-s)/span)*100);
          if(t.isMilestone){
            bar=`<div style="position:absolute;left:${l.toFixed(2)}%;top:50%;transform:translate(-50%,-50%) rotate(45deg);width:10px;height:10px;background:#fbbf24;box-shadow:0 0 8px rgba(251,191,36,0.5);z-index:5;" title="${t.name} (Marco: ${fmtD(t.start)})"></div>`;
          }else{
            const bg=t.isSummary?'rgba(79,70,229,0.12)':'rgba(79,70,229,0.03)';
            const fill=pct===100?'#10b981':t.isSummary?'#6366f1':'linear-gradient(90deg, #4f46e5, #818cf8)';
            const height=t.isSummary?'6px':'12px';
            const borderRadius=t.isSummary?'1px':'6px';
            
            const brackets=t.isSummary
              ?`<div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:#4f46e5;"></div>
                <div style="position:absolute;right:0;top:0;bottom:0;width:3px;background:#4f46e5;"></div>`
              :'';

            bar=`<div style="position:absolute;left:${l.toFixed(2)}%;width:${w.toFixed(2)}%;height:${height};top:50%;transform:translateY(-50%);background:${bg};border-radius:${borderRadius};overflow:hidden;border:1px solid rgba(79,70,229,0.15);" title="${t.name}: ${fmtD(t.start)} a ${fmtD(t.finish)} (${pct}% concluído)">
              ${brackets}
              ${pct>0?`<div style="width:${pct}%;height:100%;background:${fill};border-radius:${borderRadius};"></div>`:''}
            </div>`;
          }
        }

        rows+=`<tr class="gantt-row" data-level="${level}" style="border-bottom:1px solid #e2e8f0;height:32px;${t.isSummary?'background:#f8fafc;font-weight:700':''}">
          <td style="padding:4px 6px;font-size:11px;color:#64748b;width:40px;text-align:center;border-right:1px solid #e2e8f0">${t.wbs||''}</td>
          <td style="padding:4px 6px;padding-left:${10+indent}px;font-size:12px;${nameStyle};line-height:1.4;white-space:nowrap;border-right:1px solid #e2e8f0">
            ${t.isSummary?'<span class="toggle-icon" onclick="toggleRow(this, event)" style="color:#4f46e5;margin-right:6px;font-size:13px;font-weight:bold;cursor:pointer;display:inline-block;width:14px;text-align:center;user-select:none;" title="Expandir/Recolher">⊟</span>':'<span style="display:inline-block;width:20px;margin-right:6px;"></span>'}${t.name}
          </td>
          <td style="padding:4px 8px;font-size:12px;color:#475569;width:120px;border-right:1px solid #e2e8f0">${t.resources||'—'}</td>
          <td style="padding:4px 6px;font-size:12px;color:#0f172a;width:100px;text-align:center;border-right:1px solid #e2e8f0">${fmtD(t.start)}</td>
          <td style="padding:4px 6px;font-size:12px;color:#0f172a;width:100px;text-align:center;border-right:1px solid #e2e8f0">${fmtD(t.finish)}</td>
          <td style="padding:4px 8px;font-size:12px;color:#475569;width:80px;text-align:right;border-right:1px solid #e2e8f0">${t.duration||'—'}</td>
          <td style="padding:4px 8px;font-size:12px;color:#0f172a;width:80px;text-align:right;font-weight:700;border-right:1px solid #e2e8f0">${pct}%</td>
          <td style="padding:4px 8px;font-size:12px;color:#475569;width:100px;text-align:right;border-right:1px solid #e2e8f0">${t.budget||'R$ 0,00'}</td>
          <td style="padding:4px 8px;font-size:12px;color:#475569;width:100px;text-align:right;border-right:1px solid #e2e8f0">${t.actualCost||'R$ 0,00'}</td>
          <td style="position:relative;width:${timelineWidth}px;min-width:${timelineWidth}px;padding:0;background:#fafbfc;border-right:1px solid #e2e8f0;background-image:linear-gradient(90deg, #f1f5f9 1px, transparent 1px);background-size:${(timelineWidth / monthsCount).toFixed(1)}px 100%;">
            ${bar}
          </td>
        </tr>`;
      }

      const mppNote=data.syntheticDates
        ?'Nomes de tarefas extraídos do arquivo .mpp. Datas no Gantt são estimadas (distribuição sequencial) pois o formato binário .mpp requer Java para leitura de datas. Para datas reais, exporte como XML do Projeto no MS Project: Arquivo → Salvar Como → XML do Projeto (.xml)'
        :data.mppPartial
          ?'Nomes e datas extraídos heuristicamente do binário .mpp. Datas podem não estar alinhadas às tarefas corretas. Use XML para fidelidade total.'
          :(data.message||'');
      const mppBlock=mppWarn?`<div style="background:#fef3c7;border-left:4px solid #f59e0b;border-radius:8px;padding:12px 16px;margin:15px 20px;box-shadow: 0 1px 2px rgba(0,0,0,0.05)">
        <div style="color:#b45309;font-weight:700;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:2px;">⚠️ Arquivo .mpp — ${data.syntheticDates?'Gantt com datas estimadas':'Leitura parcial'}</div>
        <div style="color:#78350f;font-size:11px;line-height:1.6">${mppNote.replace(/\n/g,'<br>')}</div>
      </div>`:'';

      return`<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8"/>
    <title>${name} — Gantt</title>

    <script>
    function parsePtBrDate(str) {
      if(!str || str === '—') return null;
      var parts = str.split('/');
      if(parts.length === 3) {
        var y = parseInt(parts[2], 10);
        if(y < 100) y += 2000;
        return new Date(y, parseInt(parts[1], 10)-1, parseInt(parts[0], 10));
      }
      return null;
    }
    function toggleRow(iconEl, event) {
      if(event) event.stopPropagation();
      var tr = iconEl.closest('tr');
      var isCollapsed = tr.classList.contains('collapsed');
      
      if(isCollapsed) {
        tr.classList.remove('collapsed');
        iconEl.textContent = '⊟';
      } else {
        tr.classList.add('collapsed');
        iconEl.textContent = '⊞';
      }
      applyFilters();
    }
    
    function applyFilters() {
      var nameVal = document.getElementById('filterName').value.toLowerCase();
      var startVal = document.getElementById('filterStart').value;
      var endVal = document.getElementById('filterEnd').value;
      
      var startFilterDate = startVal ? new Date(startVal + 'T00:00:00') : null;
      var endFilterDate = endVal ? new Date(endVal + 'T23:59:59') : null;
      
      var rows = document.querySelectorAll('tbody tr.gantt-row');
      var collapseLevel = 9999;
      
      rows.forEach(function(r) {
        var level = parseInt(r.getAttribute('data-level'), 10) || 1;
        
        if(level <= collapseLevel) {
          collapseLevel = 9999;
        }
        
        var hiddenByTree = (level > collapseLevel);
        
        if(r.classList.contains('collapsed') && collapseLevel === 9999) {
          collapseLevel = level;
        }
        
        var show = true;
        var tName = (r.children[1].textContent || r.children[1].innerText).toLowerCase();
        var tStartStr = (r.children[3].textContent || r.children[3].innerText).trim();
        var tEndStr = (r.children[4].textContent || r.children[4].innerText).trim();
        
        if(nameVal && tName.indexOf(nameVal) === -1) show = false;
        
        if(startFilterDate || endFilterDate) {
           var rStart = parsePtBrDate(tStartStr);
           var rEnd = parsePtBrDate(tEndStr);
           if(startFilterDate && rStart && rStart < startFilterDate) show = false;
           if(endFilterDate && rEnd && rEnd > endFilterDate) show = false;
        }
        
        r.style.display = (hiddenByTree || !show) ? 'none' : '';
      });
    }
    <\/script>

<body class="antialiased">

                    </button>

    <script>
        // UPLOAD MODAL LOGIC
        function openUploadModal() {
            const overlay = document.getElementById('upload-modal-overlay');
            overlay.style.display = 'flex';
            document.getElementById('upload-state-auth').classList.remove('hidden');
            document.getElementById('upload-state-files').classList.add('hidden');
            document.getElementById('upload-password-input').value = '';
            document.getElementById('upload-file-input').value = '';
            document.getElementById('upload-progress-list').innerHTML = '';
        }

        function closeUploadModal() {
            document.getElementById('upload-modal-overlay').style.display = 'none';
        }

        function verifyUploadPassword() {
            const pwd = document.getElementById('upload-password-input').value;
            if (pwd === '789512') {
                document.getElementById('upload-state-auth').classList.add('hidden');
                document.getElementById('upload-state-files').classList.remove('hidden');
            } else {
                alert('Senha incorreta!');
            }
        }

        async function handleUploadFiles() {
            const input = document.getElementById('upload-file-input');
            const list = document.getElementById('upload-progress-list');
            const files = Array.from(input.files);
            
            if (files.length === 0) return;

            for (const file of files) {
                if (!file.name.toLowerCase().endsWith('.mpp')) {
                    list.innerHTML += `<p class="text-xs text-red-500">⚠️ ${file.name} ignorado (não é .mpp)</p>`;
                    continue;
                }

                const item = document.createElement('div');
                item.className = 'flex items-center gap-2 text-xs';
                item.innerHTML = `<span class="text-slate-500">⏳ Enviando ${file.name}...</span>`;
                list.appendChild(item);

                try {
                    const res = await fetch('/.netlify/functions/upload-project', {
                        method: 'POST',
                        headers: { 'X-File-Name': encodeURIComponent(file.name) },
                        body: file
                    });

                    const data = await res.json();
                    if (data.status === 'OK') {
                        item.innerHTML = `<span class="text-emerald-600">✅ ${file.name} enviado!</span>`;
                    } else {
                        item.innerHTML = `<span class="text-red-500">❌ ${file.name}: ${data.error}</span>`;
                    }
                } catch (e) {
                    item.innerHTML = `<span class="text-red-500">❌ ${file.name}: Erro de rede</span>`;
                }
            }

            // Atualiza a lista automaticamente após 1 segundo
            setTimeout(() => {
                window.loadProjects();
                showUploadSuccessModal();
                closeUploadModal();
            }, 1000);
        }

        // DELETE PROJECT
        async function deleteProject(name) {
            const pwd = prompt('Digite a senha de administrador para excluir:');
            if (pwd !== '789512') {
                if (pwd !== null) alert('Senha incorreta!');
                return;
            }

            try {
                const res = await fetch(`/.netlify/functions/delete-project?file=${encodeURIComponent(name)}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.status === 'OK') {
                    window.loadProjects();
                    showDeleteSuccessModal(name);
                } else {
                    alert(`Erro ao excluir: ${data.error}`);
                }
            } catch (err) {
                alert(`Erro ao excluir: ${err.message}`);
            }
        }

        function showDeleteSuccessModal(name) {
            const overlay = document.createElement('div');
            overlay.id = 'delete-success-overlay';

                    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-red-100 mb-4">
                        <svg class="h-8 w-8 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                        </svg>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 mb-1">Excluído!</h3>
                    <p class="text-sm text-slate-500 mb-6">O projeto <strong>${name}</strong> foi removido com sucesso.</p>
                    <button onclick="document.getElementById('delete-success-overlay').remove()" class="w-full bg-red-600 text-white font-bold py-2.5 rounded-xl hover:bg-red-700 transition-all text-sm uppercase tracking-wider">OK</button>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

        // DELETE ALL PROJECTS
        function openDeleteAllModal() {
            const pwd = prompt('Digite a senha para excluir todos os arquivos:');

                if (pwd !== null) alert('Senha incorreta!');

                        </svg>

                    <h3 class="text-lg font-bold text-slate-800 mb-1">Atenção!</h3>

                        <button onclick="executeDeleteAll()" class="flex-1 bg-red-600 text-white font-bold py-2.5 rounded-xl hover:bg-red-700 transition-all text-sm uppercase tracking-wider">Excluir Tudo</button>
                    </div>

        async function executeDeleteAll() {
            document.getElementById('delete-all-overlay').remove();
            
            if (!PROJECTS_LIST || PROJECTS_LIST.length === 0) {
                alert('Não há arquivos para excluir.');
                return;
            }

            const total = PROJECTS_LIST.length;
            let successCount = 0;

            for (let i = 0; i < total; i++) {
                const name = PROJECTS_LIST[i].name;
                try {
                    const res = await fetch('/.netlify/functions/delete-project?file=' + encodeURIComponent(name), { method: 'DELETE' });
                    const data = await res.json();
                    if (data.status === 'OK') {
                        successCount++;
                    }
                } catch (e) {
                    console.error('Erro ao excluir', name, e);
                }
            }
            
            window.loadProjects();
            alert(successCount + ' de ' + total + ' arquivos foram excluídos com sucesso!');
        }

        // SUCCESS MODAL
        function showUploadSuccessModal() {
            const overlay = document.createElement('div');
            overlay.id = 'upload-success-overlay';
            overlay.className = 'fixed inset-0 z-[999999] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm';
            overlay.innerHTML = `
                <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden transform transition-all animate-fade-in text-center p-6">
                    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100 mb-4">
                        <svg class="h-8 w-8 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                        </svg>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 mb-1">Upload Concluído!</h3>
                    <p class="text-sm text-slate-500 mb-6">Os arquivos foram enviados com sucesso para o GCP.</p>
                    <button onclick="document.getElementById('upload-success-overlay').remove()" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl hover:bg-emerald-700 transition-all text-sm uppercase tracking-wider">OK</button>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
        }
    </script>
</body></html>
