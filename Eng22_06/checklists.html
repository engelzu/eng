<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title data-i18n="chklists.title">Checklists de Maturidade - ProjectFlow</title>
    <link rel="stylesheet" href="/_next/static/css/6db06e54b2bd42bb.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="js/i18n.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .header-bg { background: linear-gradient(135deg, #15803d 0%, #166534 100%); color: white; padding: 2rem; border-radius: 0 0 2rem 2rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .container { max-width: 1200px; margin: -2rem auto 2rem; padding: 0 1rem; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); padding: 1.5rem; border: 1px solid #e2e8f0; }
        .btn-primary { background-color: #22c55e; color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 700; transition: all 0.2s; border: none; cursor: pointer; display: flex; items-center: center; gap: 0.5rem; }
        .btn-primary:hover { background-color: #16a34a; transform: translateY(-2px); }
        .btn-outline { border: 2px solid #e2e8f0; color: #64748b; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; transition: all 0.2s; background: transparent; cursor: pointer; }
        .btn-outline:hover { background-color: #f1f5f9; border-color: #cbd5e1; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 1rem; }
        th { background-color: #f8fafc; padding: 1rem; text-align: left; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; border-bottom: 2px solid #e2e8f0; }
        td { padding: 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; }
        tr:hover td { background-color: #f8fafc; }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .status-done { background-color: #dcfce7; color: #166534; }
        .status-pending { background-color: #fef9c3; color: #854d0e; }
        .loading-spinner { width: 3rem; height: 3rem; border: 4px solid #f3f3f3; border-top: 4px solid #22c55e; border-radius: 50%; animate: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes chkArrowPulse {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

<div class="header-bg">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1 style="font-size: 1.875rem; font-weight: 700; margin: 0;" data-i18n="chklists.header.title">Lista de Checklists</h1>
            <p style="opacity: 0.8; margin-top: 0.25rem;" data-i18n="chklists.header.subtitle">Índice Global de Maturidade do Investimento</p>
        </div>
        <button onclick="window.location.href='/'" class="btn-outline" style="color: white; border-color: rgba(255,255,255,0.3);" data-i18n="chklists.back">
            ← Voltar ao Início
        </button>
    </div>
</div>

<div class="container">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: 1rem;">
            <div style="position: relative; flex: 1; max-width: 400px;">
                <input type="text" id="search" data-i18n="chklists.search.placeholder" data-i18n-attr="placeholder" placeholder="Buscar por projeto..." style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; outline: none; focus: ring-2; ring-color: #22c55e;"/>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button onclick="openDeleteModal('all')" class="btn-outline" style="border-color: #ef4444; color: #ef4444; display: flex; align-items: center; gap: 0.25rem;" onmouseover="this.style.backgroundColor='#fee2e2'" onmouseout="this.style.backgroundColor='transparent'" data-i18n="chklists.clear.history">
                    🗑️ LIMPAR HISTÓRICO
                </button>
                <button onclick="openNewChecklist()" class="btn-primary" data-i18n="chklists.new.checklist">
                    <span>+</span> NOVO CHECKLIST
                </button>
            </div>
        </div>

        <div id="loading" style="text-align: center; padding: 3rem; display: block;">
            <div class="loading-spinner" style="margin: 0 auto;"></div>
            <p style="margin-top: 1rem; color: #64748b; font-weight: 500;" data-i18n="chklists.loading">Carregando banco de dados...</p>
        </div>

        <div id="table-container" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Projeto</th>
                        <th>Data de Criação</th>
                        <th>Maturidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="checklist-list">
                    <!-- Preenchido via JS -->
                </tbody>
            </table>
        </div>
        
        <div id="no-data" style="display: none; text-align: center; padding: 3rem;">
            <p style="color: #64748b;">Nenhum checklist encontrado.</p>
        </div>
    </div>
</div>

<!-- O MODAL DO CHECKLIST SERÁ INJETADO AQUI -->
<div id="modal-container"></div>

<script>
    // Configuração Firebase (Mesmas chaves do seu sistema)
    const firebaseConfig = {
        projectId: "studio-2837535581-1b461",
        appId: "1:734126703234:web:b5e076685289c0f43fea9b",
        storageBucket: "studio-2837535581-1b461.firebasestorage.app",
        apiKey: atob("QUl6YVN5QkRmTXRrMG9CQWROd1VKMUpPWDJtd1VQU0txMjZsNkt3"),
        authDomain: "studio-2837535581-1b461.firebaseapp.com",
        messagingSenderId: "734126703234"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Login Automático Definitivo
    async function autoLogin() {
        try {
            console.log("Tentando autenticação oficial...");
            await auth.signInWithEmailAndPassword("sistemasengenharia@cmpcrs.com.br", "Celulose@2031!");
            console.log("Autenticado como: sistemasengenharia@cmpcrs.com.br");
            loadChecklists(); // Carrega a lista principal após o login
        } catch (error) {
            console.error("Erro na autenticação:", error.message);
            // Se falhar o login, tenta carregar mesmo assim (fallback)
            loadChecklists();
        }
    }
    autoLogin();

    async function loadChecklists() {
        const listBody = document.getElementById('checklist-list');
        const loading = document.getElementById('loading');
        const tableContainer = document.getElementById('table-container');
        const noData = document.getElementById('no-data');

        try {
            const snapshot = await db.collection('checklists_investimento').orderBy('createdAt', 'desc').get();
            
            loading.style.display = 'none';
            if (snapshot.empty) {
                noData.style.display = 'block';
                tableContainer.style.display = 'none';
                return;
            }

            tableContainer.style.display = 'block';
            listBody.innerHTML = '';

            snapshot.forEach(doc => {
                const data = doc.data();
                const date = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleDateString() : '-';
                const row = document.createElement('tr');
                
                const projNameEscaped = (data.projectName || 'Sem Nome').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                
                row.innerHTML = `
                    <td style="font-weight: 600; color: #15803d;">#${doc.id.substring(0,6).toUpperCase()}</td>
                    <td style="font-weight: 500;">${data.projectName || 'Sem Nome'}</td>
                    <td>${date}</td>
                    <td><span class="status-badge status-done">${calculateMaturity(data)}%</span></td>
                    <td>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <button class="btn-outline" style="font-size: 12px; padding: 4px 8px;" onclick="viewDetails('${doc.id}')">VER DETALHES</button>
                            <button class="btn-outline" style="font-size: 12px; padding: 4px 8px; border-color: #ef4444; color: #ef4444;" onclick="openDeleteModal('single', '${doc.id}', '${projNameEscaped}')" title="Excluir">🗑️</button>
                        </div>
                    </td>
                `;
                listBody.appendChild(row);
            });
        } catch (error) {
            console.error("Erro ao carregar checklists:", error);
            loading.innerHTML = '<p style="color:red">Erro ao carregar dados do Firebase. Verifique a conexão.</p>';
        }
    }

    function calculateMaturity(data) {
        // Lógica simples de maturidade baseada em respostas preenchidas
        if (!data.responses) return 0;
        const total = Object.keys(data.responses).length;
        if (total === 0) return 0;
        let sum = 0;
        Object.values(data.responses).forEach(val => sum += parseInt(val || 0));
        return Math.round((sum / (total * 5)) * 100);
    }

    // Modal Logic (Reutilizando a lógica do Excel)
    let excelData = null;
    async function loadExcel() {
        if (excelData) return excelData;
        const response = await fetch('/Indice global de maturidade do Investimento.xlsx');
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        excelData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
        return excelData;
    }

    async function openNewChecklist() {
        const modal = createChecklistModal();
        modal.style.display = 'block';
        const container = document.getElementById('checklist-table-container-main');
        container.innerHTML = '<p style="text-align:center; padding:20px;">Carregando projetos e itens...</p>';
        
        // Popula a lista de projetos do SharePoint via FETCH DIRETO (Ignora Cachê)
        const projSelect = document.getElementById('proj-name');
        if (projSelect) {
            try {
                const _db = firebase.firestore();
                let projects = [];
                const snap = await _db.collection('fasts').get();
                if (!snap.empty) {
                    snap.forEach(doc => {
                        const d = doc.data();
                        const status = (d.status || '').toUpperCase().trim();
                        if (status === 'CONCLUÍDO' || status === 'CONCLUIDO') {
                            projects.push(d.title || d.projectName || d.name || doc.id);
                        }
                    });
                }
                
                projSelect.innerHTML = '<option value="">Selecione o Projeto (' + projects.length + ' encontrados)...</option>';
                
                const sortedProjects = [...new Set(projects)].sort((a, b) => String(a).localeCompare(String(b)));
                sortedProjects.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p;
                    opt.textContent = p;
                    projSelect.appendChild(opt);
                });
            } catch (e) {
                console.error("Erro ao carregar projetos do FAST:", e);
                projSelect.innerHTML = '<option value="">Erro ao carregar lista. Clique em Atualizar.</option>';
            }
        }

        const data = await loadExcel();
        let html = '<table style="width:100%; border-collapse:collapse;">';
        let itemCounter = 0;
        data.forEach((row, idx) => {
            if (!row || row.length === 0) return;
            if (idx === 0) {
                html += `<tr><th style="background:#15803d; color:white; padding:10px;">ITEM</th><th style="background:#15803d; color:white; padding:10px;">DESCRIÇÃO</th><th style="background:#15803d; color:white; padding:10px;">AVALIAÇÃO</th></tr>`;
            } else {
                itemCounter++;
                html += `<tr>
                    <td style="text-align:center; padding:8px; border-bottom:1px solid #eee;">${itemCounter}</td>
                    <td style="padding:8px; border-bottom:1px solid #eee;">${row[2] || ''}</td>
                    <td style="padding:8px; border-bottom:1px solid #eee;">
                        <select class="q-resp" data-idx="${idx}" style="width:100%; padding:4px;">
                            <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
                        </select>
                    </td>
                </tr>`;
            }
        });
        html += '</table>';
        container.innerHTML = html;
        
        window.handleProjectSelectChange = function() {
            const select = document.getElementById('proj-name');
            const arrow = document.getElementById('chk-proj-arrow');
            const containerWrapper = document.getElementById('checklist-questions-wrapper');
            
            if (select && select.value) {
                if (arrow) arrow.style.display = 'none';
                if (containerWrapper) containerWrapper.style.display = 'block';
            } else {
                if (arrow) arrow.style.display = 'inline-flex';
                if (containerWrapper) containerWrapper.style.display = 'none';
            }
        };
        
        window.handleProjectSelectChange();
    }

    function createChecklistModal() {
        const existing = document.getElementById('checklist-modal-main');
        if (existing) return existing;

        const modal = document.createElement('div');
        modal.id = 'checklist-modal-main';
        modal.style.cssText = 'position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none;';
        
        modal.innerHTML = `
            <div style="background:white; margin:2% auto; width:90%; max-width:1000px; height:90%; border-radius:1rem; display:flex; flex-direction:column; overflow:hidden;">
                <div style="padding:1.5rem; background:#15803d; color:white; display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="margin:0; font-size:1.25rem;">Novo Checklist de Maturidade</h2>
                    <span style="cursor:pointer; font-size:2rem;" onclick="document.getElementById('checklist-modal-main').style.display='none'">&times;</span>
                </div>
                <div style="padding:1.5rem; flex:1; overflow-y:auto;">
                    <label style="font-weight:700; font-size:12px; color:#64748b; display:flex; align-items:center; gap:6px; margin-bottom:5px;">
                        NOME DO PROJETO
                        <span id="chk-proj-arrow" style="color:#ef4444; font-size:11px; font-weight:bold; display:inline-flex; align-items:center; gap:4px; animation: chkArrowPulse 1.2s infinite;">
                            👈 SELECIONE O PROJETO PARA EXIBIR O CHECKLIST
                        </span>
                    </label>
                    <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:1.5rem;">
                        <div style="flex:1;">
                            <select id="proj-name" onchange="handleProjectSelectChange()" style="width:100%; padding:0.75rem; border:2px solid #22c55e; border-radius:0.5rem; outline:none; background:white; cursor:pointer; font-family: 'Inter', sans-serif; font-size: 14px;">
                                <option value="">Selecione o Projeto (77 disponíveis)...</option>
                            </select>
                        </div>
                        <button onclick="syncProjects()" class="btn-outline" style="padding:0.75rem; border-color:#22c55e; color:#15803d; font-size:11px;" title="Atualizar lista do SharePoint">
                            🔄 ATUALIZAR
                        </button>
                    </div>
                    <div id="checklist-questions-wrapper" style="display: none;">
                        <div id="checklist-table-container-main"></div>
                    </div>
                </div>
                <div style="padding:1.5rem; border-top:1px solid #e2e8f0; display:flex; justify-content:flex-end; gap:1rem;">
                    <button class="btn-outline" onclick="document.getElementById('checklist-modal-main').style.display='none'">Cancelar</button>
                    <button class="btn-primary" id="save-btn">SALVAR NO FIREBASE</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);

        document.getElementById('save-btn').onclick = async () => {
            const name = document.getElementById('proj-name').value;
            if (!name) return alert('Por favor, digite o nome do projeto.');

            const responses = {};
            document.querySelectorAll('.q-resp').forEach(sel => {
                responses[sel.getAttribute('data-idx')] = sel.value;
            });

            try {
                await db.collection('checklists_investimento').add({
                    projectName: name,
                    responses: responses,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert('Checklist salvo com sucesso no Firebase!');
                document.getElementById('proj-name').value = '';
                if (window.handleProjectSelectChange) window.handleProjectSelectChange();
                modal.style.display = 'none';
                loadChecklists();
            } catch (e) {
                alert('Erro ao salvar: ' + e.message);
            }
        };

        return modal;
    }

    async function syncProjects(event) {
        const btn = (event && event.target) ? event.target.closest('button') : null;
        const originalText = btn ? btn.innerHTML : null;
        if (btn) { btn.disabled = true; btn.innerHTML = '⌛...'; }
        
        try {
            const _db = firebase.firestore();
            let projects = [];
            const snap = await _db.collection('fasts').get();
            if (!snap.empty) {
                snap.forEach(doc => {
                    const d = doc.data();
                    const status = (d.status || '').toUpperCase().trim();
                    if (status === 'CONCLUÍDO' || status === 'CONCLUIDO') {
                        projects.push(d.title || d.projectName || d.name || doc.id);
                    }
                });
            }
            
            const projSelect = document.getElementById('proj-name');
            if (projSelect) {
                projSelect.innerHTML = '<option value="">Selecione o Projeto (' + projects.length + ' encontrados)...</option>';
                const sorted = [...new Set(projects)].sort((a, b) => String(a).localeCompare(String(b)));
                sorted.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p; opt.textContent = p;
                    projSelect.appendChild(opt);
                });
                alert('Lista de ' + projects.length + ' projetos do FAST sincronizada e carregada!');
            }
        } catch (e) {
            console.error(e);
            alert('Erro ao buscar projetos do FAST: ' + e.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    loadChecklists();

    // Lógica do Modal de Exclusão com Senha
    let deleteTargetType = null; // 'all' ou 'single'
    let deleteTargetId = null;

    window.openDeleteModal = function(type, id = null, projectName = '') {
        deleteTargetType = type;
        deleteTargetId = id;
        document.getElementById('delete-password').value = '';
        document.getElementById('delete-error').style.display = 'none';
        
        const title = document.getElementById('delete-modal-title');
        const desc = document.getElementById('delete-modal-desc');
        
        if (type === 'all') {
            title.innerText = 'Excluir Todo o Histórico';
            desc.innerHTML = 'Tem certeza que deseja excluir <b>TODOS</b> os checklists do histórico? Essa ação apagará a base permanentemente e não poderá ser desfeita.';
        } else {
            title.innerText = 'Excluir Checklist';
            desc.innerHTML = `Tem certeza que deseja excluir o checklist do projeto <b>${projectName}</b> permanentemente? Essa ação não poderá ser desfeita.`;
        }
        
        document.getElementById('delete-modal').style.display = 'flex';
    };

    window.closeDeleteModal = function() {
        document.getElementById('delete-modal').style.display = 'none';
        deleteTargetType = null;
        deleteTargetId = null;
    };

    document.getElementById('btn-cancel-delete').onclick = window.closeDeleteModal;

    document.getElementById('btn-confirm-delete').onclick = async () => {
        const pwd = document.getElementById('delete-password').value.trim();
        if (pwd === '789512') {
            const btn = document.getElementById('btn-confirm-delete');
            const origText = btn.innerText;
            btn.disabled = true;
            btn.innerText = 'Excluindo...';
            
            try {
                if (deleteTargetType === 'all') {
                    const snapshot = await db.collection('checklists_investimento').get();
                    if (snapshot.empty) {
                        alert('Nenhum checklist encontrado para excluir.');
                        window.closeDeleteModal();
                        return;
                    }
                    const batch = db.batch();
                    snapshot.forEach(doc => {
                        batch.delete(doc.ref);
                    });
                    await batch.commit();
                    alert('Todo o histórico de checklists foi excluído com sucesso!');
                } else if (deleteTargetType === 'single' && deleteTargetId) {
                    await db.collection('checklists_investimento').doc(deleteTargetId).delete();
                    alert('Checklist excluído com sucesso!');
                }
                window.closeDeleteModal();
                loadChecklists();
            } catch (e) {
                console.error(e);
                alert('Erro ao excluir: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = origText;
            }
        } else {
            document.getElementById('delete-error').style.display = 'block';
        }
    };
</script>

<!-- MODAL DE EXCLUSÃO (Mesmo modelo de design/overlay do resto do sistema) -->
<div id="delete-modal" style="position: fixed; inset: 0; z-index: 99999; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); padding: 1rem;">
    <div style="background: white; padding: 1.5rem; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); width: 100%; max-width: 400px; border: 1px solid #e2e8f0; color: #1e293b; font-family: 'Inter', sans-serif;">
        <h2 id="delete-modal-title" style="font-size: 1.25rem; font-weight: 700; color: #dc2626; margin-bottom: 0.75rem;">Confirmação de Exclusão</h2>
        <p id="delete-modal-desc" style="font-size: 0.875rem; color: #475569; margin-bottom: 1.25rem; line-height: 1.4;">Tem certeza que deseja realizar esta exclusão?</p>
        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <input type="password" id="delete-password" style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 0.875rem; outline: none; font-family: inherit;" placeholder="Digite a senha (789512)"/>
            <p id="delete-error" style="color: #dc2626; font-size: 0.875rem; text-align: center; margin: 0; display: none; font-weight: 600;">Senha incorreta.</p>
            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; border-top: 1px solid #e2e8f0; padding-top: 1rem; margin-top: 0.5rem;">
                <button type="button" class="btn-outline" style="padding: 0.5rem 1rem; font-size: 0.875rem;" onclick="window.closeDeleteModal()">Não, Cancelar</button>
                <button type="button" id="btn-confirm-delete" class="btn-primary" style="background-color: #dc2626; padding: 0.5rem 1rem; font-size: 0.875rem; color: white;">Sim, Excluir</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
