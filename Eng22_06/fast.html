        // Helper: get React fiber state from a DOM node
        function getReactState(node) {
            if (!node) return null;
            const key = Object.keys(node).find(k => k.startsWith('__reactFiber') || k.startsWith('__reactInternalInstance'));
            if (!key) return null;
            let fiber = node[key];

                    }
                    return states;
                }
                fiber = fiber.return;
            }
            return null;
        }

        // Helper: find the current FAST record ID from the URL or DOM
        function getCurrentFastId() {
            // Try to find the ID from the side panel or any data attribute
            const panel = document.querySelector('[data-fast-id]');
            if (panel) return panel.getAttribute('data-fast-id');
            
            // Try from any element with id in DOM
            const idEl = document.querySelector('[data-id]');
            if (idEl) return idEl.getAttribute('data-id');
            
            return null;
        }

        // Main: intercept SALVAR BUSINESS CASE button
        function interceptSaveButton() {
            document.addEventListener('click', async function(e) {
                const btn = e.target.closest('button');
                if (!btn || !btn.textContent.includes('SALVAR BUSINESS CASE')) return;

                // Find the toggle switch (div with bg-emerald-500 or bg-slate-300)
                const modal = document.querySelector('[role="dialog"]');
                if (!modal) return;

                // Find toggle: look for the div that controls state
                const toggle = modal.querySelector('.w-9.h-5.rounded-full');
                const isOn = toggle && toggle.classList.contains('bg-emerald-500');
                
                console.log('[BC-PATCH] SALVAR clicked. Toggle isOn:', isOn);

                // Get the fast ID - look for it in the component state
                // The modal is triggered from a row - find which row is selected
                const selectedRow = document.querySelector('tr.bg-blue-50, tr[data-selected="true"], tbody tr.selected');
                
                // Try to find ID from any visible data
                let fastId = null;
                
                // Look for the ID in nearby elements - check the side panel header
                const codeEl = modal.querySelector('[class*="code"], [class*="Code"]');
                if (codeEl) {
                    const match = codeEl.textContent.match(/[#\s]?(\d+)/);
                    if (match) fastId = match[1];
                }
                
                // Alternative: scan the modal title for code
                const modalTitle = modal.querySelector('h2, [class*="title"], [class*="Title"]');
                if (!fastId && modalTitle) {
                    const match = modalTitle.textContent.match(/[#\s]?(\d+)/);
                    if (match) fastId = match[1];
                }

                // Save via direct Firebase if we have the data
                if (isOn !== null) {
                    // Store toggle state in window for the React bundle to use
                    window._bcEnviarAprovacao = isOn;
                    window._bcPatchTriggered = true;
                    console.log('[BC-PATCH] Stored bcEnviarAprovacao:', isOn, 'FastID:', fastId);
                    
                    // If React's eh() fails to save status, we'll detect it and save directly
                    // Watch for 2 seconds after save for status change
                    if (fastId && window._currentFastDocId) {
                        setTimeout(async () => {
                            try {
                                const fastRef = doc(db, 'fasts', window._currentFastDocId);
                                const newStatus = isOn ? 'AGUARDANDO APROVAÇÃO' : (window._bcStatusAnterior || '');
                                const updateData = { bcEnviarAprovacao: isOn, updatedAt: new Date().toISOString() };
                                if (newStatus) updateData.status = newStatus;
                                await updateDoc(fastRef, updateData);
                                console.log('[BC-PATCH] Direct Firebase save SUCCESS. status:', newStatus);
                            } catch(err) {
                                console.error('[BC-PATCH] Direct save error:', err);
                            }
                        }, 500);
                    }
                }
            }, true); // use capture to run before React handlers
        }

        // Track current fast document ID via MutationObserver
        function trackFastId() {
            const observer = new MutationObserver(function() {
                // Look for any element showing the current fast ID
                // Check if a row is highlighted/selected in the table
                const rows = document.querySelectorAll('tbody tr');
                rows.forEach(row => {
                    if (row.classList.contains('bg-blue-50') || row.style.backgroundColor) {
                        // Try to get firestore ID from React fiber
                        const key = Object.keys(row).find(k => k.startsWith('__reactFiber'));
                        if (key) {
                            let fiber = row[key];
                            while (fiber) {
                                if (fiber.memoizedProps && fiber.memoizedProps.onClick) {
                                    // Found clickable row, try to get item from closure
                                    break;
                                }
                                fiber = fiber.return;
                            }
                        }
                    }
                });
                
                // Look for the panel/modal with data
                const panel = document.querySelector('[class*="panel"], [class*="Panel"], [class*="side"]');
                if (panel) {
                    // Extract ID from any text content
                    const text = panel.textContent;
                    // Store in window for our save handler
                }
            });
            observer.observe(document.body, { childList: true, subtree: true });
        }

        // Capture the current fast ID when a row is clicked
        document.addEventListener('click', function(e) {
            const row = e.target.closest('tbody tr');
            if (!row) return;
            
            // Try to get React fiber to find the item's ID
            const key = Object.keys(row).find(k => k.startsWith('__reactFiber') || k.startsWith('__reactInternalInstance'));
            if (!key) return;
            
            let fiber = row[key];
            let depth = 0;
            while (fiber && depth < 30) {
                if (fiber.memoizedProps) {
                    const props = fiber.memoizedProps;
                    // Look for onClick with row data
                    if (props.item && props.item.id) {
                        window._currentFastDocId = props.item.id;
                        window._bcStatusAnterior = props.item.status;
                        console.log('[BC-PATCH] Captured fast ID:', window._currentFastDocId, 'status:', window._bcStatusAnterior);
                        break;
                    }
                    if (props.row && props.row.id) {
                        window._currentFastDocId = props.row.id;
                        window._bcStatusAnterior = props.row.status;
                        console.log('[BC-PATCH] Captured fast ID from row:', window._currentFastDocId);
                        break;
                    }
                    if (props.fast && props.fast.id) {
                        window._currentFastDocId = props.fast.id;
                        window._bcStatusAnterior = props.fast.status;
                        console.log('[BC-PATCH] Captured fast ID from fast prop:', window._currentFastDocId);
                        break;
                    }
                }
                fiber = fiber.return;
                depth++;
            }
        }, true);

        // Also intercept the modal open to capture the ID
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('button');
            if (!btn || !btn.textContent.includes('FAZER O BUSINESS CASE DIGITAL')) return;
            console.log('[BC-PATCH] BC Modal opened. currentFastDocId:', window._currentFastDocId);
        }, true);

        // Wait for DOM to be ready and start intercepting
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', interceptSaveButton);
        } else {
            interceptSaveButton();
        }
        
        console.log('[BC-PATCH] Direct Firebase save interceptor loaded.');

    <script>

            handle.style.cssText = "position: fixed; width: 14px; height: 14px; background: #4f46e5; border: 2px solid white; cursor: nwse-resize; z-index: 2147483647; border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,0.4); pointer-events: auto;";
            
            function positionHandle() {
                var rect = img.getBoundingClientRect();
                handle.style.top = (rect.bottom - 14) + "px";
                handle.style.left = (rect.right - 14) + "px";
            }
            
            positionHandle();
            document.body.appendChild(handle);
            img.style.outline = "2px solid #4f46e5";

                mdEvent.stopPropagation();

                startHeight = img.getBoundingClientRect().height;

                    var deltaY = mmEvent.clientY - startY;

            }

                document.execCommand("defaultParagraphSeparator", false, "p");
            });

                var tb = el.previousSibling;
                if (!tb) return;

                    var handle = document.createElement('div');
                    handle.className = 'bc-tbl-col-handle';
                    handle.style.cssText = [
                        'position:fixed',
                        'width:14px',
                        'cursor:col-resize',
                        'z-index:2147483645',
                        'background:rgba(99,102,241,0.22)',
                        'border-left:2px solid rgba(99,102,241,0.65)',
                        'border-right:2px solid rgba(99,102,241,0.65)',

                    window._bcTableHandles.push(handle);

                        var nextCol     = cols[idx + 1];
                        var nextStartW  = nextCol ? (parseFloat(nextCol.style.width) || 0) : null;
                        var startTableW = table.offsetWidth;

                        handle.style.background = 'rgba(99,102,241,0.75)';

                        // Full-screen overlay ensures no event escapes to Radix/editor
                        var overlay = document.createElement('div');
                        overlay.className = 'bc-drag-overlay';
                        overlay.style.cssText = [
                            'position:fixed',
                            'inset:0',
                            'z-index:2147483646',
                            'cursor:col-resize',
                            'user-select:none',
                            'background:transparent',
                            'pointer-events:all',
                            'touch-action:none'

                        overlay._bcPointerDown = function() {}; // no-op for interceptor
                        document.body.appendChild(overlay);

                        overlay.addEventListener('mousemove', function(mvEvt) {
                            var delta = mvEvt.clientX - startX;
                            var newW  = Math.max(20, startW + delta);
                            col.style.width = newW + 'px';
                            if (nextCol && nextStartW !== null) {
                                nextCol.style.width = Math.max(20, nextStartW - delta) + 'px';
                            } else {

                                table.style.width = (startTableW + (newW - startW)) + 'px';
                            }
                            placeHandle();
                        });

                        function endDrag() {
                            overlay.remove();
                            handle.style.background = 'rgba(99,102,241,0.22)';
                            editor.dispatchEvent(new Event('input', { bubbles: true }));
                            setTimeout(function() { bcMakeColHandles(table, editor); }, 10);

            el.addEventListener('click', function(e) {

                                var event = new Event('input', { bubbles: true });
                                ta.dispatchEvent(event);
                            });
                        }
                    });
                } catch(err) {
                    console.error('[TinyMCE] Failed to init on', ta.id, err);
                    ta.removeAttribute('data-tiny-bc-init');
                }
            });
        }

        (function(){ var _obs = new MutationObserver(function() {
            initBcTinymce();
        });
        _obs.observe(document.body, { childList: true, subtree: true }); })();

        setInterval(initBcTinymce, 1000);

        setTimeout(initBcTinymce, 500);
    </script>
