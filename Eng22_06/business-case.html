      '<path d="M9 3l6 14M5.5 12h13" stroke-linecap="round" stroke-linejoin="round"/>',
      '</svg>',
      '<div style="position:absolute;bottom:2px;left:4px;right:4px;height:3px;background:currentColor;border-radius:2px"></div>'
    ].join(''), function(e) { e.stopPropagation(); fgPal.showAt(fgBtn); });
    fgBtn.style.position = 'relative';

    // ── Background/Highlight color ──
    var bgPal = createColorPalette('Cor de Destaque', function(c) {
      applyStyle('backgroundColor', c, getEditor(toolbar));
    });
    var bgBtn = mkBtn('Cor de fundo / destaque', [
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">',
      '<path d="M12 3l2 5H10l2-5zM4 14h16l2 5H2l2-5z" stroke-linecap="round" stroke-linejoin="round"/>',
      '</svg>',
      '<div style="position:absolute;bottom:2px;left:4px;right:4px;height:3px;background:#fde047;border-radius:2px"></div>'
    ].join(''), function(e) { e.stopPropagation(); bgPal.showAt(bgBtn); });
    bgBtn.style.position = 'relative';

    row.appendChild(fgBtn); row.appendChild(bgBtn); row.appendChild(sep());

    // ── Undo ──
    var undoBtn = mkBtn('Desfazer (Ctrl+Z)',
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7v6h6M3.5 13C5.4 8.2 10.3 5 16 5c4.4 0 8 3.6 8 8s-3.6 8-8 8c-2.7 0-5.1-1.3-6.6-3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      function() { document.execCommand('undo'); });

    // ── Redo ──
    var redoBtn = mkBtn('Refazer (Ctrl+Y)',
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 7v6h-6M20.5 13C18.6 8.2 13.7 5 8 5c-4.4 0-8 3.6-8 8s3.6 8 8 8c2.7 0 5.1-1.3 6.6-3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      function() { document.execCommand('redo'); });

    row.appendChild(undoBtn); row.appendChild(redoBtn); row.appendChild(sep());

    // ── HTML mode ──
    var htmlBtn = mkBtn('Ver/Editar código HTML', '&lt;&gt;',
      function() { toggleHtmlMode(toolbar); });
    htmlBtn.classList.add('bc-html-toggler');
    htmlBtn.style.fontFamily = '"Courier New",monospace';

    row.appendChild(htmlBtn);
    toolbar.appendChild(row);
    toolbar.style.flexWrap = 'wrap';
  }

  // ── Word paste cleanup ──────────────────────────────────────────────────
  document.addEventListener('paste', function(e) {
    if (!e.target || !e.target.isContentEditable) return;
    var html = e.clipboardData && e.clipboardData.getData('text/html');
    if (!html) return;
    // Check if it looks like Word content
    if (!html.includes('mso-') && !html.includes('urn:schemas-microsoft') && !html.includes('MsoNormal')) return;
    e.preventDefault();
    var clean = html
      .replace(/<o:p[\s\S]*?<\/o:p>/gi, '')
      .replace(/<w:[^>]*>[\s\S]*?<\/w:[^>]*>/gi, '')
      .replace(/<m:[^>]*>[\s\S]*?<\/m:[^>]*>/gi, '')
      .replace(/<!--[\s\S]*?-->/g, '')
      .replace(/class="[^"]*Mso[^"]*"/gi, '')
      .replace(/style="([^"]*)"/gi, function(m, s) {
        var keep = s.replace(/mso-[^;]+;?\s*/gi, '')
                    .replace(/font-family:[^;]+;?\s*/gi, '')
                    .replace(/margin[^:]*:[^;]+;?\s*/gi, '');
        return keep.trim() ? 'style="' + keep.trim() + '"' : '';
      })
      .replace(/<span\s*(?:style="\s*")?>/gi, '<span>')
      .replace(/<span><\/span>/gi, '')
      .replace(/&nbsp;/g, ' ');
    document.execCommand('insertHTML', false, clean);
  }, true);

  // ── Range saver for toolbar interaction ────────────────────────────────
  document.addEventListener('mousedown', function(e) {
    if (!e.target.closest('.bc-editor-toolbar')) return;
    try {
      var sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        var n = sel.getRangeAt(0).commonAncestorContainer;
        var ce = n.nodeType === 3 ? n.parentNode : n;
        while (ce && ce !== document.body) {
          if (ce.getAttribute && ce.getAttribute('contenteditable') === 'true') { break; }
          ce = ce.parentNode;
        }
        if (ce && ce !== document.body) {
          window._bcSavedRange  = sel.getRangeAt(0).cloneRange();
          window._bcSavedEditor = ce;
        }
      }
    } catch(err) {
      console.warn('document mousedown error:', err);
    }
  }, true);

  // ── MutationObserver: enhance toolbars as React renders them ──────────
  var obs = new MutationObserver(function(muts) {
    muts.forEach(function(m) {
      m.addedNodes.forEach(function(node) {
        if (node.nodeType !== 1) return;
        if (node.classList && node.classList.contains('bc-editor-toolbar')) enhanceToolbar(node);
        if (node.querySelectorAll) {
          node.querySelectorAll('.bc-editor-toolbar').forEach(function(t) { enhanceToolbar(t); });
        }
      });
    });
  });
  obs.observe(document.body, { childList: true, subtree: true });
  document.querySelectorAll('.bc-editor-toolbar').forEach(enhanceToolbar);

})();
</script>







<script id="bc-inert-guard">
// ── Aggressive inert guard for BC UI elements ──
(function() {
  var BC_IDS = ['bc-table-bar', 'bc-img-bar', 'bc-img-size-modal', 'bc-img-size-card'];
  var BC_CLASSES = ['bc-img-handle', 'bc-color-palette'];
  var ATTRS = ['inert', 'aria-hidden', 'aria-modal', 'data-hidden', 'hidden'];

  function unblock(el) {
    if (!el || el.nodeType !== 1) return;
    ATTRS.forEach(function(a) {
      if (el.hasAttribute(a)) el.removeAttribute(a);
    });
    el.style.pointerEvents = 'all !important';
  }

  function checkAll() {
    BC_IDS.forEach(function(id) { unblock(document.getElementById(id)); });
    BC_CLASSES.forEach(function(cls) {
      document.querySelectorAll('.' + cls).forEach(unblock);
    });
  }

  // Run check immediately and on any DOM mutation that touches attributes
  var guard = new MutationObserver(function(muts) {
    var needsCheck = false;
    for (var i = 0; i < muts.length; i++) {
      var m = muts[i];
      if (m.type === 'attributes' && ATTRS.indexOf(m.attributeName) !== -1) {
        var t = m.target;
        var id = t.id;
        var cls = t.className;
        if (BC_IDS.indexOf(id) !== -1) { unblock(t); }
        else if (typeof cls === 'string' && BC_CLASSES.some(function(c) { return cls.indexOf(c) !== -1; })) { unblock(t); }
        else { needsCheck = true; }
      }
      if (m.type === 'childList') { needsCheck = true; }
    }
    if (needsCheck) checkAll();
  });

  guard.observe(document.documentElement, {
    subtree: true,
    attributes: true,
    attributeFilter: ATTRS,
    childList: true
  });

  checkAll();
})();
</script>

<script id="bc-adv-edit-script">
/* ═══ BC Advanced Image & Table Editing v10.0 (Matching Styles & Column Refresh) ═══ */
(function() {
  'use strict';

  var _activeImg  = null;
  var _handles    = [];
  var _imgBar     = null;
  var _tableBar   = null;
  var _activeCell = null;
  var _ctxMenu    = null;

  // ── UTILS ────────────────────────────────────────────────────────────────
  function getEditor(el) {
    var n = el;
    while (n && n !== document.body) {
      if (n.getAttribute && n.getAttribute('contenteditable') === 'true') return n;
      n = n.parentNode;
    }
    return null;
  }

  function notifyEditor(el) {
    var ed = getEditor(el);
    if (ed) ed.dispatchEvent(new Event('input', { bubbles: true }));
  }

  // Get closest dialog root or topmost Radix portal (or body)
  function getPortalFor(el) {
    if (el) {
      var n = el;
      while (n && n !== document.body) {
        if (n.getAttribute && (n.getAttribute('role') === 'dialog' || n.hasAttribute('data-radix-dialog-content') || n.classList.contains('DialogContent'))) {
          return n;
        }
        n = n.parentNode;
      }
    }
    var dialog = document.querySelector('[role="dialog"]') || 
                 document.querySelector('[data-radix-dialog-content]') ||
                 document.querySelector('.DialogContent');
    if (dialog) return dialog;
    var portals = document.querySelectorAll('[data-radix-portal]');
    return portals.length > 0 ? portals[portals.length - 1] : document.body;
  }

  function moveToPortal(el, activeEl) {
    if (!el) return;
    var portal = getPortalFor(activeEl);
    if (el.parentNode !== portal) portal.appendChild(el);
    el.removeAttribute('inert');
    el.removeAttribute('aria-hidden');
    el.style.pointerEvents = 'auto';
  }
  window.moveToPortal = moveToPortal;

  // ── IMAGE HANDLES (using Pointer Events + setPointerCapture) ─────────────

  function removeHandles() {
    _handles.forEach(function(wrap) { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); });
    _handles = [];
    if (_imgBar) _imgBar.style.display = 'none';
    if (_activeImg) {
      _activeImg.style.outline = '';
      _activeImg.style.outlineOffset = '';
      _activeImg = null;
    }
    // Remove legacy single handle
    var old = document.getElementById('bc-img-resize-handle');
    if (old && old.parentNode) old.parentNode.removeChild(old);
  }

  //  TL TC TR
  //  ML    MR
  //  BL BC BR
  var HDEFS = [
    [0,   0,   'nwse-resize', -1, -1],
    [0,   0.5, 'ns-resize',    0, -1],
    [0,   1,   'nesw-resize',  1, -1],
    [0.5, 0,   'ew-resize',   -1,  0],
    [0.5, 1,   'ew-resize',    1,  0],
    [1,   0,   'nesw-resize', -1,  1],
    [1,   0.5, 'ns-resize',    0,  1],
    [1,   1,   'nwse-resize',  1,  1],
  ];

  function positionHandle(wrap, def, rect) {
    var SZ = 10;
    var top  = rect.top  + rect.height * def[0] - SZ / 2;
    var left = rect.left + rect.width  * def[1] - SZ / 2;
    var parentRect = wrap.offsetParent ? wrap.offsetParent.getBoundingClientRect() : { top: 0, left: 0 };
    wrap.style.top  = (top - parentRect.top) + 'px';
    wrap.style.left = (left - parentRect.left) + 'px';
  }

  function repositionAll() {
    if (!_activeImg) return;
    var rect = _activeImg.getBoundingClientRect();
    _handles.forEach(function(wrap, i) { positionHandle(wrap, HDEFS[i], rect); });
    if (_imgBar) positionImgBar(_activeImg);
  }

  function showImageHandles(img) {
    removeHandles();
    _activeImg = img;
    img.style.outline = '2.5px solid #6366f1';
    img.style.outlineOffset = '2px';

    var editor = getEditor(img);
    var rect   = img.getBoundingClientRect();

    HDEFS.forEach(function(def, idx) {
      var wrap = document.createElement('div');
      wrap.className = 'bc-img-handle-wrap';
      wrap.style.cursor = def[2];

      var inner = document.createElement('div');
      inner.className = 'bc-img-handle-inner';
      wrap.appendChild(inner);

      moveToPortal(wrap, img);
      positionHandle(wrap, def, rect);
      _handles.push(wrap);

      // ── POINTER EVENTS with setPointerCapture ──
      inner.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        inner.setPointerCapture(e.pointerId);

        var sx = e.clientX, sy = e.clientY;
        var iRect = img.getBoundingClientRect();
        var sw = iRect.width, sh = iRect.height;
        var ar = sh / sw;
        var dxSign = def[3], dySign = def[4];

        function onMove(me) {
          var dX = (me.clientX - sx) * dxSign;
          var dY = (me.clientY - sy) * dySign;
          var nW, nH;

          if (dxSign !== 0 && dySign !== 0) {
            nW = Math.max(20, sw + dX);
            nH = me.shiftKey ? Math.max(20, sh + dY) : nW * ar;
          } else if (dxSign !== 0) {
            nW = Math.max(20, sw + dX);
            nH = nW * ar;
          } else {
            nH = Math.max(20, sh + dY);
            nW = nH / ar;
          }

          img.style.width  = nW + 'px';
          img.style.height = nH + 'px';
          repositionAll();
        }

        function onUp() {
          inner.removeEventListener('pointermove', onMove);
          inner.removeEventListener('pointerup', onUp);
          if (editor) editor.dispatchEvent(new Event('input', { bubbles: true }));
        }

        inner.addEventListener('pointermove', onMove);
        inner.addEventListener('pointerup', onUp);
      });
    });

    // Show image toolbar
    if (!_imgBar) { _imgBar = buildImgBar(); }
    moveToPortal(_imgBar, img);
    _imgBar._img    = img;
    _imgBar._editor = editor;
    _imgBar.style.display = 'flex';
    positionImgBar(img);

    // Update on scroll
    window._bcImgScrollFn = repositionAll;
    document.addEventListener('scroll', window._bcImgScrollFn, true);
    window.addEventListener('resize', window._bcImgScrollFn);
  }

  function positionImgBar(img) {
    if (!_imgBar) return;
    var rect = img.getBoundingClientRect();
    var bh = _imgBar.offsetHeight || 32;
    var bw = _imgBar.offsetWidth  || 200;
    var top  = rect.top - bh - 8;
    if (top < 4) top = rect.bottom + 8;
    var left = Math.max(4, Math.min(rect.left, window.innerWidth - bw - 4));
    var parentRect = _imgBar.offsetParent ? _imgBar.offsetParent.getBoundingClientRect() : { top: 0, left: 0 };
    _imgBar.style.top  = (top - parentRect.top) + 'px';
    _imgBar.style.left = (left - parentRect.left) + 'px';
  }

  function buildImgBar() {
    var bar = document.createElement('div');
    bar.id = 'bc-img-bar';

    function addBtn(html, title, fn) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.title = title; btn.innerHTML = html;
      btn.addEventListener('pointerdown', function(e) { e.preventDefault(); e.stopPropagation(); });
      btn.addEventListener('click', function(e) { e.stopPropagation(); fn(); });
      bar.appendChild(btn);
    }
    function addSep() {
      var s = document.createElement('div'); s.className = 'bc-bar-sep'; bar.appendChild(s);
    }

    addBtn('<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h16" stroke-linecap="round"/></svg>', 'Alinhar à esquerda', function() { var p = _imgBar._img && _imgBar._img.parentNode; if (p) p.style.textAlign='left'; });
    addBtn('<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M4 18h16" stroke-linecap="round"/></svg>', 'Centralizar', function() { var p = _imgBar._img && _imgBar._img.parentNode; if (p) p.style.textAlign='center'; });
    addBtn('<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 6h16M10 12h10M4 18h16" stroke-linecap="round"/></svg>', 'Alinhar à direita', function() { var p = _imgBar._img && _imgBar._img.parentNode; if (p) p.style.textAlign='right'; });
    addSep();
    addBtn('↔ Original', 'Restaurar tamanho original', function() {
      var img = _imgBar._img; if (!img) return;
      img.style.width = ''; img.style.height = '';
      repositionAll();
    });
    addBtn('⤡ 50%', 'Reduzir para 50%', function() {
      var img = _imgBar._img; if (!img) return;
      var pw = (img.parentNode ? img.parentNode.offsetWidth : 0) || 400;
      img.style.width = Math.floor(pw * 0.5) + 'px'; img.style.height = 'auto';
      setTimeout(repositionAll, 0);
    });
    addBtn('⤢ 100%', 'Largura total', function() {
      var img = _imgBar._img; if (!img) return;
      img.style.width = '100%'; img.style.height = 'auto';
      setTimeout(repositionAll, 0);
    });
    addSep();
    addBtn('<svg width="12" height="12" fill="none" stroke="#f87171" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke-linecap="round" stroke-linejoin="round"/></svg>', 'Excluir imagem', function() {
      var img = _imgBar._img; if (!img) return;
      var ed  = _imgBar._editor;
      var par = img.parentNode;
      var rem = (par && par.tagName === 'DIV') ? par : img;
      if (rem.parentNode) rem.parentNode.removeChild(rem);
      removeHandles();
      if (ed) ed.dispatchEvent(new Event('input', { bubbles: true }));
    });

    return bar;
  }

  // ── TABLE TOOLBAR ────────────────────────────────────────────────────────

  function getTable(cell) {
    var n = cell;
    while (n && n !== document.body && n.tagName !== 'TABLE') n = n.parentNode;
    return n && n.tagName === 'TABLE' ? n : null;
  }

  function makeTd(isHead) {
    var td = document.createElement(isHead ? 'th' : 'td');
    // Match the exact style and border color of the table picker cells (#94a3b8)
    td.style.cssText = 'padding:6px;border:1px solid #94a3b8;min-height:22px;vertical-align:top';
    td.innerHTML = '&nbsp;';
    return td;
  }

  function redistributeWidths(table) {
    if (!table) return;
    var rows = table.getElementsByTagName('tr');
    var colCount = 0;
    for (var i = 0; i < rows.length; i++) {
      if (getTable(rows[i]) === table) {
        colCount = Math.max(colCount, rows[i].cells.length);
      }
    }
    if (colCount === 0) return;
    var newWidth = (100 / colCount).toFixed(2) + '%';
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (getTable(row) !== table) continue;
      for (var j = 0; j < row.cells.length; j++) {
        row.cells[j].style.width = newWidth;
      }
    }
  }

  function refreshTableResizer(table) {
    if (!table) return;
    // Dispatch a click on the table to trigger the resizer handle generation
    setTimeout(function() {
      table.dispatchEvent(new Event('click', { bubbles: true }));
    }, 50);
  }

  function afterOp(node) {
    notifyEditor(node);
    if (_activeCell && _tableBar) positionTableBar(_activeCell);
  }

  function bcAddRowAbove(cell) {
    if (!cell) return;
    var row = cell.parentNode; if (!row) return;
    var cols = row.cells.length;
    var newRow = document.createElement('tr');
    for (var i = 0; i < cols; i++) newRow.appendChild(makeTd(row.parentNode && row.parentNode.tagName === 'THEAD'));
    row.parentNode.insertBefore(newRow, row);
    afterOp(cell);
  }

  function bcAddRowBelow(cell) {
    if (!cell) return;
    var row = cell.parentNode; if (!row) return;
    var cols = row.cells.length;
    var newRow = document.createElement('tr');
    for (var i = 0; i < cols; i++) newRow.appendChild(makeTd(false));
    row.nextSibling ? row.parentNode.insertBefore(newRow, row.nextSibling) : row.parentNode.appendChild(newRow);
    afterOp(cell);
  }

  function bcDeleteRow(cell) {
    if (!cell) return;
    var table = getTable(cell); if (!table) return;
    var rows = table.getElementsByTagName('tr');
    var count = 0;
    for (var i = 0; i < rows.length; i++) {
      if (getTable(rows[i]) === table) count++;
    }
    if (count <= 1) { bcDeleteTable(cell); return; }
    cell.parentNode.parentNode.removeChild(cell.parentNode);
    _activeCell = null; notifyEditor(table);
    if (_tableBar) _tableBar.style.display = 'none';
  }

  function bcAddColLeft(cell) {
    if (!cell || typeof cell.cellIndex === 'undefined') return;
    var ci = cell.cellIndex;
    var table = getTable(cell); if (!table) return;
    var rows = table.getElementsByTagName('tr');
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (getTable(row) !== table) continue;
      var ref = row.cells[ci];
      var td = makeTd(row.parentNode && row.parentNode.tagName === 'THEAD');
      if (ref) {
        row.insertBefore(td, ref);
      } else {
        row.appendChild(td);
      }
    }
    redistributeWidths(table);
    afterOp(cell);
    refreshTableResizer(table);
  }

  function bcAddColRight(cell) {
    if (!cell || typeof cell.cellIndex === 'undefined') return;
    var ci = cell.cellIndex;
    var table = getTable(cell); if (!table) return;
    var rows = table.getElementsByTagName('tr');
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (getTable(row) !== table) continue;
      var ref = row.cells[ci + 1];
      var td = makeTd(row.parentNode && row.parentNode.tagName === 'THEAD');
      if (ref) {
        row.insertBefore(td, ref);
      } else {
        row.appendChild(td);
      }
    }
    redistributeWidths(table);
    afterOp(cell);
    refreshTableResizer(table);
  }

  function bcDeleteCol(cell) {
    if (!cell || typeof cell.cellIndex === 'undefined') return;
    var ci = cell.cellIndex;
    var table = getTable(cell); if (!table) return;
    
    var firstRow = null;
    var rows = table.getElementsByTagName('tr');
    for (var i = 0; i < rows.length; i++) {
      if (getTable(rows[i]) === table) {
        firstRow = rows[i];
        break;
      }
    }
    if (firstRow && firstRow.cells.length <= 1) {
      bcDeleteTable(cell);
      return;
    }

    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (getTable(row) !== table) continue;
      var c = row.cells[ci];
      if (c) row.removeChild(c);
    }
    redistributeWidths(table);
    _activeCell = null; notifyEditor(table);
    if (_tableBar) _tableBar.style.display = 'none';
    refreshTableResizer(table);
  }

  function bcDeleteTable(cell) {
    if (!cell) return;
    var table = getTable(cell); if (!table) return;
    var ed = getEditor(table);
    table.parentNode && table.parentNode.removeChild(table);
    hideTableBar();
    if (ed) ed.dispatchEvent(new Event('input', { bubbles: true }));
  }

  // Helper to run table operations and catch any JS errors
  function runTableOp(fn) {
    try {
      fn();
    } catch(err) {
      alert("Erro na operação de tabela:\n" + err.message + "\n" + err.stack);
    }
  }

  function ensureTableBar() {
    if (_tableBar) return _tableBar;
    var bar = document.createElement('div');
    bar.id = 'bc-table-bar';

    function addLabel(txt, color) {
      var lbl = document.createElement('span');
      lbl.className = 'tb-label'; lbl.textContent = txt; lbl.style.color = color;
      bar.appendChild(lbl);
    }
    function addSep() {
      var s = document.createElement('div'); s.className = 'tb-sep'; bar.appendChild(s);
    }
    function addBtn(label, title, fn, danger) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.title = title; btn.innerHTML = label;
      if (danger) btn.classList.add('danger');
      btn.addEventListener('pointerdown', function(e) { e.preventDefault(); e.stopPropagation(); });
      btn.addEventListener('click', function(e) { e.stopPropagation(); e.preventDefault(); runTableOp(fn); });
      bar.appendChild(btn);
    }

    addLabel('LINHAS', '#4ade80');
    addBtn('↑ Linha acima',  'Inserir linha acima',   function() { bcAddRowAbove(_activeCell); });
    addBtn('↓ Linha abaixo', 'Inserir linha abaixo',  function() { bcAddRowBelow(_activeCell); });
    addBtn('✕ Del Linha',    'Excluir linha atual',    function() { bcDeleteRow(_activeCell); }, true);
    addSep();
    addLabel('COLUNAS', '#60a5fa');
    addBtn('← Col.esq',  'Inserir coluna à esquerda', function() { bcAddColLeft(_activeCell); });
    addBtn('→ Col.dir',  'Inserir coluna à direita',  function() { bcAddColRight(_activeCell); });
    addBtn('✕ Del Col',  'Excluir coluna atual',      function() { bcDeleteCol(_activeCell); }, true);
    addSep();
    addBtn('🗑 Del Tabela', 'Excluir tabela inteira', function() { bcDeleteTable(_activeCell); }, true);

    _tableBar = bar;
    return bar;
  }

  function positionTableBar(cell) {
    var bar = ensureTableBar();
    var table = getTable(cell); if (!table) return;
    moveToPortal(bar, cell);
    bar.style.display = 'flex';

    var rect = table.getBoundingClientRect();
    var bh = bar.offsetHeight || 38;
    var bw = bar.offsetWidth  || 400;
    var top  = rect.top - bh - 6;
    if (top < 4) top = rect.bottom + 6;
    if (top + bh > window.innerHeight - 4) top = 4;
    var left = Math.max(4, Math.min(rect.left, window.innerWidth - bw - 4));

    var parentRect = bar.offsetParent ? bar.offsetParent.getBoundingClientRect() : { top: 0, left: 0 };
    bar.style.top  = (Math.max(4, top) - parentRect.top) + 'px';
    bar.style.left = (left - parentRect.left) + 'px';
  }

  function hideTableBar() {
    if (_tableBar) _tableBar.style.display = 'none';
    _activeCell = null;
  }

  // ── CONTEXT MENU ─────────────────────────────────────────────────────────
  function removeCtx() {
    if (_ctxMenu && _ctxMenu.parentNode) _ctxMenu.parentNode.removeChild(_ctxMenu);
    _ctxMenu = null;
  }

  function showCtx(items, x, y, activeEl) {
    removeCtx();
    var menu = document.createElement('div');
    menu.id = 'bc-ctx-menu';
    menu.style.left = '0px';
    menu.style.top  = '0px';
    moveToPortal(menu, activeEl);
    _ctxMenu = menu;

    var targetX = Math.min(x, window.innerWidth  - 200);
    var targetY = Math.min(y, window.innerHeight - 300);

    var parentRect = menu.offsetParent ? menu.offsetParent.getBoundingClientRect() : { top: 0, left: 0 };
    menu.style.left = (targetX - parentRect.left) + 'px';
    menu.style.top  = (targetY - parentRect.top) + 'px';

    items.forEach(function(item) {
      if (item === '-') { var s = document.createElement('div'); s.className = 'ctx-sep'; menu.appendChild(s); return; }
      var d = document.createElement('div');
      d.className = 'ctx-item' + (item.danger ? ' danger' : '');
      d.innerHTML = (item.icon ? '<span>' + item.icon + '</span>' : '') + item.label;
      d.addEventListener('pointerdown', function(e) { e.preventDefault(); e.stopPropagation(); });
      d.addEventListener('click', function(e) { e.stopPropagation(); item.fn(); removeCtx(); });
      menu.appendChild(d);
    });

    setTimeout(function() {
      document.addEventListener('pointerdown', removeCtx, { once: true, capture: true });
    }, 0);
  }

  // ── MAIN EVENT HANDLERS ──────────────────────────────────────────────────

  document.addEventListener('click', function(e) {
    var t = e.target;

    // Ignore our own UI elements
    if (t.closest && (
      t.closest('#bc-img-bar') || t.closest('#bc-table-bar') ||
      t.closest('#bc-ctx-menu') || t.closest('.bc-img-handle-wrap') ||
      t.closest('#bc-img-size-modal') || t.closest('.bc-color-palette')
    )) return;

    // Image
    if (t.tagName === 'IMG' && getEditor(t)) {
      showImageHandles(t);
      setTimeout(function() {
        var old = document.getElementById('bc-img-resize-handle');
        if (old && old.parentNode) old.parentNode.removeChild(old);
      }, 0);
      hideTableBar();
      return;
    }

    // Click outside image → clear handles
    if (_activeImg) removeHandles();

    // Table cell
    var cell = t.closest ? t.closest('td, th') : null;
    if (cell && getEditor(cell)) {
      _activeCell = cell;
      positionTableBar(cell);
    } else {
      if (_tableBar) _tableBar.style.display = 'none';
      _activeCell = null;
    }
  });

  document.addEventListener('keyup', function() {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var n = sel.getRangeAt(0).commonAncestorContainer;
    if (n.nodeType === 3) n = n.parentNode;
    var cell = n && n.closest ? n.closest('td, th') : null;
    if (cell && getEditor(cell)) { _activeCell = cell; positionTableBar(cell); }
    else if (!cell) {
      if (_tableBar) _tableBar.style.display = 'none';
      _activeCell = null;
    }
  });

  // Right-click context menus
  document.addEventListener('contextmenu', function(e) {
    var t = e.target;
    if (t.tagName === 'IMG' && getEditor(t)) {
      e.preventDefault();
      if (_activeImg !== t) showImageHandles(t);
      showCtx([
        { icon:'◀', label:'Alinhar à esquerda', fn: function() { if (t.parentNode) t.parentNode.style.textAlign='left'; } },
        { icon:'▬', label:'Centralizar',         fn: function() { if (t.parentNode) t.parentNode.style.textAlign='center'; } },
        { icon:'▶', label:'Alinhar à direita',   fn: function() { if (t.parentNode) t.parentNode.style.textAlign='right'; } },
        '-',
        { icon:'↔', label:'Largura original',    fn: function() { t.style.width=''; t.style.height=''; } },
        { icon:'⤢', label:'100% (largura total)',fn: function() { t.style.width='100%'; t.style.height='auto'; } },
        { icon:'⤡', label:'50%',                 fn: function() { var pw=(t.parentNode?t.parentNode.offsetWidth:0)||400; t.style.width=Math.floor(pw*.5)+'px'; t.style.height='auto'; } },
        '-',
        { icon:'🗑', label:'Excluir imagem', danger:true, fn: function() {
          var ed=getEditor(t); var rem=(t.parentNode&&t.parentNode.tagName==='DIV')?t.parentNode:t;
          if (rem.parentNode) rem.parentNode.removeChild(rem); removeHandles();
          if (ed) ed.dispatchEvent(new Event('input',{bubbles:true}));
        }},
      ], e.clientX, e.clientY, t);
      return;
    }
    var cell = t.closest ? t.closest('td, th') : null;
    if (cell && getEditor(cell)) {
      e.preventDefault(); _activeCell = cell; positionTableBar(cell);
      showCtx([
        { icon:'↑', label:'Inserir linha acima',       fn: function(){ bcAddRowAbove(cell); } },
        { icon:'↓', label:'Inserir linha abaixo',      fn: function(){ bcAddRowBelow(cell); } },
        { icon:'←', label:'Inserir coluna à esquerda', fn: function(){ bcAddColLeft(cell);  } },
        { icon:'→', label:'Inserir coluna à direita',  fn: function(){ bcAddColRight(cell); } },
        '-',
        { icon:'✕', label:'Excluir linha',  danger:true, fn: function(){ bcDeleteRow(cell); } },
        { icon:'✕', label:'Excluir coluna', danger:true, fn: function(){ bcDeleteCol(cell); } },
        '-',
        { icon:'🗑', label:'Excluir tabela', danger:true, fn: function(){ bcDeleteTable(cell); } },
      ], e.clientX, e.clientY, cell);
    }
  });

  // Expose for external use
  window.bcAddRowAbove = bcAddRowAbove; window.bcAddRowBelow = bcAddRowBelow;
  window.bcDeleteRow   = bcDeleteRow;   window.bcAddColLeft  = bcAddColLeft;
  window.bcAddColRight = bcAddColRight; window.bcDeleteCol   = bcDeleteCol;
  window.bcDeleteTable = bcDeleteTable;

})();
</script>
