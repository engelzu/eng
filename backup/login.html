<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charSet="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="login.title">Login - ProjectFlow SAS</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="js/i18n.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            position: relative;
        }
        .login-card h1 {
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(90deg, #60a5fa, #a78bfa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .login-card p {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #3b82f6;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }
        .btn-login:hover { opacity: 0.9; }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg {
            color: #dc2626;
            font-size: 12px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        /* Language selector flags */
        .lang-flags {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .lang-flag {
            width: 42px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid #e2e8f0;
            background: #ffffff;
            transition: all 0.25s ease;
            opacity: 0.5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .lang-flag:hover {
            opacity: 0.8;
            transform: scale(1.1);
        }
        .lang-flag.active {
            opacity: 1;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.3), 0 4px 12px rgba(0,0,0,0.15);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Language selector with flags -->
        <div class="lang-flags">
            <div class="lang-flag" data-lang="pt-BR" onclick="selectLang('pt-BR')" title="Português (Brasil)">
                <img src="https://flagcdn.com/w40/br.png" alt="BR" style="width: 28px; border-radius: 2px; display: block;" />
            </div>
            <div class="lang-flag" data-lang="es-ES" onclick="selectLang('es-ES')" title="Español (Chile)">
                <img src="https://flagcdn.com/w40/cl.png" alt="CL" style="width: 28px; border-radius: 2px; display: block;" />
            </div>
        </div>
        <h1 data-i18n="login.heading">Gestor Engenharia</h1>
        <p data-i18n="login.subtitle">ProjectFlow SAS — Faça login para continuar</p>
        <form id="login-form">
            <div class="form-group">
                <label data-i18n="login.email.label">E-mail</label>
                <input type="email" id="email" data-i18n="login.email.placeholder" data-i18n-attr="placeholder" placeholder="seu@email.com" required />
            </div>
            <div class="form-group">
                <label data-i18n="login.password.label">Senha</label>
                <input type="password" id="password" data-i18n="login.password.placeholder" data-i18n-attr="placeholder" placeholder="Sua senha" required />
            </div>
            <button type="submit" class="btn-login" id="btn-login" data-i18n="login.button">ENTRAR</button>
            <p class="error-msg" id="error-msg"></p>
        </form>
    </div>

    <script>
        function selectLang(lang) {
            if (window.i18n) {
                window.i18n.setLang(lang);
            } else {
                localStorage.setItem('gestor-lang', lang);
            }
            document.querySelectorAll('.lang-flag').forEach(f => {
                f.classList.toggle('active', f.dataset.lang === lang);
            });
        }

        (function () {
            const savedLang = localStorage.getItem('gestor-lang') || 'pt-BR';
            document.querySelectorAll('.lang-flag').forEach(f => {
                f.classList.toggle('active', f.dataset.lang === savedLang);
            });
        })();

        const firebaseConfig = {
            projectId: "studio-2837535581-1b461",
            appId: "1:734126703234:web:b5e076685289c0f43fea9b",
            storageBucket: "studio-2837535581-1b461.firebasestorage.app",
            apiKey: atob("QUl6YVN5QkRmTXRrMG9CQWROd1VKMUpPWDJtd1VQU0txMjZsNkt3"),
            authDomain: "studio-2837535581-1b461.firebaseapp.com",
            messagingSenderId: "734126703234"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.location.replace('index.html');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errorEl = document.getElementById('error-msg');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.textContent = window.i18n ? window.i18n.t('login.button.loading') : 'ENTRANDO...';
            errorEl.style.display = 'none';

            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
            } catch (err) {
                const t = window.i18n ? window.i18n.t.bind(window.i18n) : (k) => {
                    const map = {
                        'login.error.generic': 'Erro ao fazer login. Verifique suas credenciais.',
                        'login.error.notfound': 'Usu\u00e1rio n\u00e3o encontrado.',
                        'login.error.wrongpassword': 'Senha incorreta.',
                        'login.error.invalidemail': 'E-mail inv\u00e1lido.',
                        'login.error.toomanyrequests': 'Muitas tentativas. Tente mais tarde.',
                        'login.button': 'ENTRAR'
                    };
                    return map[k] || k;
                };
                let msg = t('login.error.generic');
                if (err.code === 'auth/user-not-found') msg = t('login.error.notfound');
                else if (err.code === 'auth/wrong-password') msg = t('login.error.wrongpassword');
                else if (err.code === 'auth/invalid-email') msg = t('login.error.invalidemail');
                else if (err.code === 'auth/too-many-requests') msg = t('login.error.toomanyrequests');
                errorEl.textContent = msg;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = t('login.button');
            }
        });
    </script>
</body>
</html>
